le cx="5" cy="6.5" r="2.4"/><circle cx="5" cy="17.5" r="2.4"/><circle cx="19" cy="12" r="2.4"/><path d="M7.3 7.7 16.7 11M7.3 16.3 16.7 13"/></g><circle cx="1462" cy="200" r="74" fill="url(#glow4)"/><circle cx="1462" cy="200" r="28" fill="#FF5C00"/><g transform="translate(1450,188)" fill="none" stroke="#FFFFFF" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4.5"/><circle cx="12" cy="12" r="1.5" fill="#FFFFFF" stroke="none"/></g><text x="60" y="112" font-family="Inter Display, Inter, DejaVu Sans, sans-serif" font-size="12" font-weight="700" fill="#1E4DFF" text-anchor="start" letter-spacing="3.2">INPUT</text><text x="60" y="148" font-family="Inter Display, Inter, DejaVu Sans, sans-serif" font-size="23" font-weight="800" fill="#0B1020" text-anchor="start">Data &amp; fixed bounds</text><line x1="60" y1="163" x2="114" y2="163" stroke="#1E4DFF" stroke-width="3"/><text x="60" y="268" font-family="Inter Display, Inter, DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#3D4657" text-anchor="start">56,781 experimental records</text><text x="60" y="292" font-family="Inter Display, Inter, DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#3D4657" text-anchor="start">NEMAD, Landolt–Börnstein, literature</text><text x="60" y="316" font-family="Inter Display, Inter, DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#3D4657" text-anchor="start">Slater–Pauling, Stoner, Kronmüller</text><text x="60" y="340" font-family="Inter Display, Inter, DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#3D4657" text-anchor="start">and Maxwell — none of them fitted</text><text x="405" y="112" font-family="Inter Display, Inter, DejaVu Sans, sans-serif" font-size="12" font-weight="700" fill="#00BFA5" text-anchor="start" letter-spacing="3.2">STRUCTURE</text><text x="405" y="148" font-family="Inter Display, Inter, DejaVu Sans, sans-serif" font-size="23" font-weight="800" fill="#0B1020" text-anchor="start">DAO — build the cell</text><line x1="405" y1="163" x2="459" y2="163" stroke="#00BFA5" stroke-width="3" stroke-dasharray="7 5"/><text x="405" y="268" font-family="Inter Display, Inter, DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#3D4657" text-anchor="start">DAO-G generates a relaxed 3D</text><text x="405" y="292" font-family="Inter Display, Inter, DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#3D4657" text-anchor="start">unit cell from stoichiometry</text><text x="405" y="316" font-family="Inter Display, Inter, DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#3D4657" text-anchor="start">DAO-P returns energy above hull,</text><text x="405" y="340" font-family="Inter Display, Inter, DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#3D4657" text-anchor="start">so unstable phases drop out early</text><text x="750" y="112" font-family="Inter Display, Inter, DejaVu Sans, sans-serif" font-size="12" font-weight="700" fill="#8B2FFF" text-anchor="start" letter-spacing="3.2">DESCRIPTORS</text><text x="750" y="148" font-family="Inter Display, Inter, DejaVu Sans, sans-serif" font-size="23" font-weight="800" fill="#0B1020" text-anchor="start">MACE — read the symmetry</text><line x1="750" y1="163" x2="804" y2="163" stroke="#8B2FFF" stroke-width="3" stroke-dasharray="7 5"/><text x="750" y="268" font-family="Inter Display, Inter, DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#3D4657" text-anchor="start">E(3)-equivariant message passing</text><text x="750" y="292" font-family="Inter Display, Inter, DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#3D4657" text-anchor="start">over bond angles, coordination</text><text x="750" y="316" font-family="Inter Display, Inter, DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#3D4657" text-anchor="start">polyhedra and site symmetry</text><text x="750" y="340" font-family="Inter Display, Inter, DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#3D4657" text-anchor="start">separates τ-MnAl from β-MnAl</text><text x="1095" y="112" font-family="Inter Display, Inter, DejaVu Sans, sans-serif" font-size="12" font-weight="700" fill="#FF2D78" text-anchor="start" letter-spacing="3.2">MODELS</text><text x="1095" y="148" font-family="Inter Display, Inter, DejaVu Sans, sans-serif" font-size="23" font-weight="800" fill="#0B1020" text-anchor="start">Property prediction</text><line x1="1095" y1="163" x2="1149" y2="163" stroke="#FF2D78" stroke-width="3" stroke-dasharray="7 5"/><text x="1095" y="268" font-family="Inter Display, Inter, DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#3D4657" text-anchor="start">gradient boosting, the MagFormer</text><text x="1095" y="292" font-family="Inter Display, Inter, DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#3D4657" text-anchor="start">transformer, physics-informed nets</text><text x="1095" y="316" font-family="Inter Display, Inter, DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#3D4657" text-anchor="start">targets: Curie &amp; Néel points, Ms,</text><text x="1095" y="340" font-family="Inter Display, Inter, DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#3D4657" text-anchor="start">Hc, K1, (BH)max, and FM/AFM/NM</text><text x="1440" y="112" font-family="Inter Display, Inter, DejaVu Sans, sans-serif" font-size="12" font-weight="700" fill="#FF5C00" text-anchor="start" letter-spacing="3.2">OUTPUT</text><text x="1440" y="148" font-family="Inter Display, Inter, DejaVu Sans, sans-serif" font-size="23" font-weight="800" fill="#0B1020" text-anchor="start">Inverse design</text><line x1="1440" y1="163" x2="1494" y2="163" stroke="#FF5C00" stroke-width="3" stroke-dasharray="7 5"/><text x="1440" y="268" font-family="Inter Display, Inter, DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#3D4657" text-anchor="start">specification in: (BH)max ≥ 120 kJ/m³,</text><text x="1440" y="292" font-family="Inter Display, Inter, DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#3D4657" text-anchor="start">Curie point ≥ 450 K, rare-earth free</text><text x="1440" y="316" font-family="Inter Display, Inter, DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#3D4657" text-anchor="start">ranked candidates out, each one</text><text x="1440" y="340" font-family="Inter Display, Inter, DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#3D4657" text-anchor="start">re-checked against the bounds</text><text x="60" y="386" font-family="Inter Display, Inter, DejaVu Sans, sans-serif" font-size="11.5" font-weight="700" fill="#8894A7" text-anchor="start" letter-spacing="3.2">EXPECTED OUTCOME</text><line x1="60" y1="396" x2="1760" y2="398" stroke="#D9E0EA" stroke-width="1.2"/><text x="60" y="424" font-family="EB Garamond, Noto Serif, DejaVu Serif, serif" font-size="16" font-weight="400" fill="#1E4DFF" text-anchor="start" font-style="italic">→ the reference every later</text><text x="60" y="445" font-family="EB Garamond, Noto Serif, DejaVu Serif, serif" font-size="16" font-weight="400" fill="#1E4DFF" text-anchor="start" font-style="italic">   prediction is held to</text><text x="405" y="424" font-family="EB Garamond, Noto Serif, DejaVu Serif, serif" font-size="16" font-weight="400" fill="#00BFA5" text-anchor="start" font-style="italic">→ a physical structure for</text><text x="405" y="445" font-family="EB Garamond, Noto Serif, DejaVu Serif, serif" font-size="16" font-weight="400" fill="#00BFA5" text-anchor="start" font-style="italic">   any formula, without DFT</text><text x="750" y="424" font-family="EB Garamond, Noto Serif, DejaVu Serif, serif" font-size="16" font-weight="400" fill="#8B2FFF" text-anchor="start" font-style="italic">→ geometry that composition</text><text x="750" y="445" font-family="EB Garamond, Noto Serif, DejaVu Serif, serif" font-size="16" font-weight="400" fill="#8B2FFF" text-anchor="start" font-style="italic">   alone cannot encode</text><text x="1095" y="424" font-family="EB Garamond, Noto Serif, DejaVu Serif, serif" font-size="16" font-weight="400" fill="#FF2D78" text-anchor="start" font-style="italic">→ conformal error bars on</text><text x="1095" y="445" font-family="EB Garamond, Noto Serif, DejaVu Serif, serif" font-size="16" font-weight="400" fill="#FF2D78" text-anchor="start" font-style="italic">   every predicted value</text><text x="1440" y="424" font-family="EB Garamond, Noto Serif, DejaVu Serif, serif" font-size="16" font-weight="400" fill="#FF5C00" text-anchor="start" font-style="italic">→ a shortlist worth</text><text x="1440" y="445" font-family="EB Garamond, Noto Serif, DejaVu Serif, serif" font-size="16" font-weight="400" fill="#FF5C00" text-anchor="start" font-style="italic">   taking to synthesis</text></svg>